<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地震台网事件编目与修订</title>
  <style>
    :root { --line:#e5e7eb; --muted:#6b7280; --bad:#b91c1c; --warn:#b45309; --ok:#15803d; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 1.5rem; color: #1f2937; }
    main { max-width: 1080px; margin: auto; }
    .bar { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
    select, input, textarea, button { font: inherit; padding: .35rem .55rem; border: 1px solid var(--line); border-radius: 6px; }
    button { cursor: pointer; background: #f9fafb; }
    button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    .layout { display: grid; grid-template-columns: 360px 1fr; gap: 1rem; }
    .tabs { display: flex; gap: .25rem; margin-bottom: .5rem; }
    .tabs button { flex: 1; }
    .tabs button.active { background: #1f2937; color: #fff; border-color: #1f2937; }
    .card { border: 1px solid var(--line); border-radius: 8px; padding: .75rem; margin-bottom: .5rem; cursor: pointer; }
    .card:hover { border-color: #9ca3af; }
    .card.sel { border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb; }
    .muted { color: var(--muted); font-size: .85rem; }
    .tag { display: inline-block; font-size: .75rem; padding: .05rem .4rem; border-radius: 999px; border: 1px solid var(--line); margin-right: .25rem; }
    .tag.bad { color: var(--bad); border-color: #fecaca; background: #fef2f2; }
    .tag.warn { color: var(--warn); border-color: #fde68a; background: #fffbeb; }
    .tag.ok { color: var(--ok); border-color: #bbf7d0; background: #f0fdf4; }
    pre { background: #f3f4f6; padding: .75rem; border-radius: 8px; overflow-x: auto; font-size: .8rem; }
    h3 { margin: .25rem 0; }
    section { border: 1px solid var(--line); border-radius: 10px; padding: 1rem; }
    .row { display: flex; gap: .5rem; align-items: center; margin: .4rem 0; flex-wrap: wrap; }
    label { font-size: .85rem; color: var(--muted); }
    .error { color: var(--bad); white-space: pre-wrap; }
    table { border-collapse: collapse; width: 100%; font-size: .82rem; }
    th, td { border-bottom: 1px solid var(--line); text-align: left; padding: .3rem .4rem; vertical-align: top; }
  </style>
</head>
<body>
<main>
  <h1>地震台网事件编目与修订</h1>
  <div class="bar">
    <label>用户<input id="userId" value="duty1" size="8"></label>
    <label>角色
      <select id="role">
        <option value="analyst">analyst 分析员</option>
        <option value="reviewer">reviewer 复核员</option>
        <option value="admin">admin 管理员</option>
        <option value="station">station 台站</option>
        <option value="viewer">viewer 只读</option>
      </select>
    </label>
    <button onclick="loadList()">刷新列表</button>
    <span class="muted">同站重复上报自动留时间偏移更小者；&gt;120s 或 &gt;3km 存疑；有效&lt;3 或均距&gt;2km 需管理员写依据放行。</span>
  </div>
  <div class="layout">
    <section>
      <div class="tabs">
        <button data-stage="candidate" class="active">候选</button>
        <button data-stage="review">待复核</button>
        <button data-stage="published">已发布</button>
      </div>
      <div id="list"><p class="muted">加载中…</p></div>
    </section>
    <section id="detail"><p class="muted">点击左侧事件查看摘要与历史版本。</p></section>
  </div>
</main>
<script>
let stage = 'candidate';
let selected = null;

function headers() {
  return {'X-User-Id': document.getElementById('userId').value,
          'X-Role': document.getElementById('role').value,
          'Content-Type': 'application/json'};
}

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json();
  if (!res.ok) throw new Error((body.type || 'Error') + ': ' + body.error);
  return body;
}

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    stage = btn.dataset.stage;
    loadList();
  };
});

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

async function loadList() {
  const box = document.getElementById('list');
  box.innerHTML = '<p class="muted">加载中…</p>';
  const data = await api('/api/events?stage=' + stage);
  if (!data.items.length) { box.innerHTML = '<p class="muted">（暂无事件）</p>'; return; }
  box.innerHTML = data.items.map(item => {
    const s = item.summary || {};
    const tags = [];
    if (s.associated) {
      const gate = s.gate_passes ? '<span class="tag ok">质量分 ' + esc(s.quality_score) + '</span>'
                                 : '<span class="tag bad">闸门未过</span>';
      tags.push(gate);
      if (s.suspect_count) tags.push('<span class="tag warn">存疑 ' + s.suspect_count + '</span>');
      if (s.duplicate_count) tags.push('<span class="tag warn">去重 ' + s.duplicate_count + '</span>');
      tags.push('<span class="tag">有效 ' + esc(s.valid_count) + '</span>');
    }
    return '<div class="card' + (selected === item.id ? ' sel' : '') + '" onclick="loadDetail(\'' + item.id + '\')">'
      + '<h3>' + esc(s.title || item.id) + '</h3>'
      + '<div class="muted">' + esc(s.status_label || item.status) + ' · v' + item.version
      + (s.origin_time ? ' · ' + esc(s.origin_time) : '') + '</div>'
      + '<div style="margin-top:.35rem">' + tags.join('') + '</div></div>';
  }).join('');
}

async function loadDetail(id) {
  selected = id;
  const box = document.getElementById('detail');
  box.innerHTML = '<p class="muted">加载中…</p>';
  let detail;
  try { detail = await api('/api/entities/' + id + '/detail'); }
  catch (e) { box.innerHTML = '<p class="error">' + esc(e.message) + '</p>'; return; }
  const s = detail.summary || {};
  const a = detail.data.association;
  const m = a ? a.metrics : null;
  let html = '<h2>' + esc(s.title) + '</h2>'
    + '<div class="row"><span class="tag">' + esc(s.status_label) + '</span><span class="muted">v' + detail.version + ' · ' + esc(detail.id) + '</span></div>'
    + '<h3>摘要</h3><table>'
    + '<tr><th>发震时刻</th><td>' + esc(s.origin_time) + '</td></tr>'
    + '<tr><th>位置</th><td>' + esc(s.location) + '</td></tr>'
    + '<tr><th>震级</th><td>' + esc(s.magnitude || '—') + '</td></tr>'
    + '<tr><th>原始报文</th><td>' + esc(s.report_count) + ' 条</td></tr>';
  if (a) {
    html += '<tr><th>质量分</th><td>' + esc(a.quality_score) + '（有效 ' + esc(m.valid_count)
      + ' / 去重 ' + esc(m.duplicate_count) + ' / 存疑 ' + esc(m.suspect_count)
      + '；均距 ' + esc(m.average_distance_km) + ' km）</td></tr>'
      + '<tr><th>复核闸门</th><td>' + (a.review_gate.passes
          ? '<span class="tag ok">通过（≥3 条有效且均距≤2km）</span>'
          : '<span class="tag bad">未过：需管理员写明依据放行</span>') + '</td></tr>'
      + '<tr><th>固化版本</th><td>v' + esc(a.frozen_version) + ' @ ' + esc(a.frozen_at)
      + '（关联快照此后不可修订）</td></tr>';
  }
  if (detail.data.review_override) {
    const o = detail.data.review_override;
    html += '<tr><th>管理员放行</th><td><span class="tag warn">override</span> ' + esc(o.reason)
      + '<div class="muted">' + esc(o.actor_id) + ' · ' + esc(o.recorded_at) + '</div></td></tr>';
  }
  html += '</table><h3>关联报文</h3>' + reportTable(a)
    + '<h3>历史版本</h3><div id="versions" class="muted">加载中…</div>'
    + '<h3>动作</h3><div id="actions" class="row"></div>'
    + '<pre id="result" class="muted">等待操作</pre>';
  box.innerHTML = html;
  renderActions(detail);
  renderVersions(id);
}

function reportTable(a) {
  if (!a) return '<p class="muted">尚未关联。</p>';
  const rows = a.accepted_reports.map(r => '<tr><td>' + esc(r.station || r.station_code || '—') + '</td>'
    + '<td>' + esc(r.time_offset) + ' s</td><td>' + esc(r.distance_km) + ' km</td>'
    + '<td>' + (r.suspect ? '<span class="tag bad">存疑</span>' : '<span class="tag ok">有效</span>') + '</td></tr>').join('');
  const dropped = a.duplicate_reports.map(r => '<tr><td>' + esc(r.station || r.station_code || '—') + '</td>'
    + '<td>' + esc(r.time_offset) + ' s</td><td>' + esc(r.distance_km) + ' km</td>'
    + '<td><span class="tag warn">重复，去重</span></td></tr>').join('');
  return '<table><tr><th>台站</th><th>时间偏移</th><th>距离</th><th>判定</th></tr>' + rows + dropped + '</table>';
}

async function renderVersions(id) {
  try {
    const data = await api('/api/entities/' + id + '/versions');
    document.getElementById('versions').innerHTML = '<table><tr><th>版本</th><th>状态</th><th>摘要</th><th>时间</th></tr>'
      + data.items.map(v => {
        const a = v.data.association;
        const note = a ? ('质量分 ' + a.quality_score + '，有效 ' + a.metrics.valid_count + '，v' + a.frozen_version + ' 固化')
                       : (v.data.magnitude != null ? '震级 ' + esc(v.data.magnitude) : '报文 ' + (v.data.reports || []).length + ' 条');
        return '<tr><td>v' + v.version + '</td><td>' + esc(v.status) + '</td><td>' + note + '</td><td>' + esc(v.created_at) + '</td></tr>';
      }).join('') + '</table>';
  } catch (e) { document.getElementById('versions').innerHTML = '<span class="error">' + esc(e.message) + '</span>'; }
}

function renderActions(detail) {
  const st = detail.status;
  const defs = {
    candidate: [['associate', '关联', {}]],
    associated: [['review', '复核', 'review']],
    reviewed: [['publish', '发布', 'publish']],
    published: [['revise', '修订', 'revise'], ['withdraw', '撤回', 'withdraw']],
    revised: [['revise', '再次修订', 'revise'], ['withdraw', '撤回', 'withdraw']],
  };
  const acts = defs[st] || [];
  document.getElementById('actions').innerHTML = acts.map(([name, label, kind]) =>
    '<button class="primary" onclick="doAction(\'' + detail.id + '\',\'' + name + '\',\'' + (kind || '') + '\',' + detail.version + ')">' + label + '</button>').join(' ')
    || '<span class="muted">当前状态无可执行动作。</span>';
}

function actionForm(kind) {
  if (kind === 'review') {
    return {reviewer: prompt('复核员', document.getElementById('userId').value) || '',
            magnitude: Number(prompt('震级', '4.0')),
            override_reason: prompt('闸门未过时管理员放行依据（通过可留空）', '') || ''};
  }
  if (kind === 'publish') return {communication_id: prompt('通报编号', 'C-' + Date.now()) || ''};
  if (kind === 'revise') return {reason: prompt('修订原因', '后补报文') || '', magnitude: Number(prompt('修订震级', '4.1'))};
  if (kind === 'withdraw') return {reason: prompt('撤回原因', '') || ''};
  return {};
}

async function doAction(id, action, kind, version) {
  const data = actionForm(kind);
  if (Object.values(data).some(v => v === '')) { alert('必填项未填写'); return; }
  try {
    const out = await api('/api/entities/' + id + '/actions',
      {method: 'POST', headers: headers(), body: JSON.stringify({action, data, expected_version: version})});
    document.getElementById('result').textContent = 'OK → ' + out.status + ' v' + out.version;
    await Promise.all([loadList(), loadDetail(id)]);
  } catch (e) {
    document.getElementById('result').className = 'error';
    document.getElementById('result').textContent = e.message;
  }
}

loadList().catch(e => document.getElementById('list').innerHTML = '<p class="error">' + esc(e.message) + '</p>');
</script>
</body>
</html>
