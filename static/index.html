<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地震台网事件编目与修订</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 900px; margin: auto; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    button { padding: .5rem .8rem; cursor: pointer; }
    .tabs button { margin-right: .5rem; }
    .tabs button.active { font-weight: 700; border-bottom: 2px solid #2563eb; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #e5e7eb; padding: .4rem .6rem; text-align: left; font-size: .9rem; }
    tr:hover { background: #f9fafb; cursor: pointer; }
    .badge { display: inline-block; padding: .1rem .5rem; border-radius: 999px; background: #e5e7eb; font-size: .8rem; }
    .badge.blocked { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>
<main>
  <h1>地震台网事件编目与修订</h1>
  <p><button onclick="checkHealth()">检查服务状态</button></p>
  <pre id="result">等待操作</pre>

  <h2>事件列表</h2>
  <div class="tabs">
    <button data-stage="candidate" class="active" onclick="loadStage('candidate', this)">候选</button>
    <button data-stage="review" onclick="loadStage('review', this)">待复核</button>
    <button data-stage="published" onclick="loadStage('published', this)">已发布</button>
  </div>
  <table>
    <thead>
      <tr><th>标题</th><th>状态</th><th>报文数</th><th>质量分</th><th>存疑</th><th>拦截</th></tr>
    </thead>
    <tbody id="eventRows"><tr><td colspan="6">加载中…</td></tr></tbody>
  </table>

  <h2>事件详情</h2>
  <pre id="detail">点击列表中的事件查看摘要与历史版本</pre>

  <h2>常用接口</h2>
  <pre>GET  /health
GET  /api/&lt;kind&gt;?stage=candidate|review|published
POST /api/&lt;kind&gt;
GET  /api/entities/&lt;id&gt;
GET  /api/entities/&lt;id&gt;/detail
POST /api/entities/&lt;id&gt;/actions</pre>
</main>
<script>
const STATUS_LABELS = {
  candidate: '候选', associated: '待复核', reviewed: '已复核',
  published: '已发布', revised: '已修订', withdrawn: '已撤回'
};

async function checkHealth() {
  const response = await fetch('/health');
  document.getElementById('result').textContent = JSON.stringify(await response.json(), null, 2);
}

async function loadStage(stage, button) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  if (button) button.classList.add('active');
  const response = await fetch('/api/events?stage=' + stage);
  const payload = await response.json();
  const rows = document.getElementById('eventRows');
  if (!payload.items || !payload.items.length) {
    rows.innerHTML = '<tr><td colspan="6">暂无事件</td></tr>';
    return;
  }
  rows.innerHTML = '';
  for (const item of payload.items) {
    const assoc = (item.data && item.data.association) || {};
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + (item.data.title || item.id) + '</td>' +
      '<td>' + (STATUS_LABELS[item.status] || item.status) + '</td>' +
      '<td>' + ((item.data.reports || []).length) + '</td>' +
      '<td>' + (assoc.quality_score != null ? assoc.quality_score : '—') + '</td>' +
      '<td>' + (assoc.suspicious_count != null ? assoc.suspicious_count : '—') + '</td>' +
      '<td>' + (assoc.review_blocked ? '<span class="badge blocked">拦截</span>' : '<span class="badge">通过</span>') + '</td>';
    tr.onclick = () => loadDetail(item.id);
    rows.appendChild(tr);
  }
}

async function loadDetail(id) {
  const response = await fetch('/api/entities/' + id + '/detail');
  const detail = await response.json();
  const lines = [];
  lines.push('摘要: ' + JSON.stringify(detail.summary || {}, null, 2));
  lines.push('');
  lines.push('历史版本:');
  for (const v of detail.versions || []) {
    lines.push('  v' + v.version + ' [' + (STATUS_LABELS[v.status] || v.status) + '] '
      + v.created_at + ' by ' + v.actor_id);
  }
  document.getElementById('detail').textContent = lines.join('\n');
}

loadStage('candidate', document.querySelector('.tabs button'));
</script>
</body>
</html>
